version: '3.7'

services:
  postgres:
    image: postgres:16.3
    ports:
      - '8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: backend
      POSTGRES_PASSWORD: "ZMbT1p_LyxZhvV2f_Ay92Yb2BSJMdt7q"
    volumes:
      - backend_data:/var/lib/postgresql/data
  redis:
    image: redis:6.2.6
    ports:
      - '8091:6379'
    command: redis-server --requirepass "UkNJTsRBsuT2pTUi_cUR_rgDM_7yOzBD"
    environment:
      - REDIS_REPLICATION_MODE=master
volumes:
  backend_data:
